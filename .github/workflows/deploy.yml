# Controleert en bouwt de app en zet hem via SFTP op Strato (conqueston.nl/opkomst) bij elke push naar main.
# Slaagt `npm run check` niet, dan wordt er niets geüpload.
# De Firebase-config staat in .env.production (niet geheim).
# Vereist in GitHub > Settings > Secrets and variables > Actions:
#   STRATO_SFTP_HOST      SFTP-server uit het Strato-klantmenu (bijv. ssh.strato.de)
#   STRATO_SFTP_USER      SFTP-gebruikersnaam
#   STRATO_SFTP_PASSWORD  SFTP-wachtwoord
#   STRATO_DIR            map die bij conqueston.nl/opkomst/ hoort, bijv. /opkomst of /conqueston/opkomst.
#                         Mag de SFTP-gebruiker alleen in die map zelf (zo is het nu), vul dan `inlogmap` in.
# Optioneel: STRATO_SFTP_PORT (standaard 22)
# Uitnodigingen mailen (public/api/uitnodiging-mail.php), optioneel:
#   MAIL_USER             Strato-mailbox die verstuurt, bijv. noreply@conqueston.nl
#   MAIL_PASSWORD         wachtwoord van die mailbox
#   APP_URL               adres van de app (standaard https://conqueston.nl/opkomst)
name: Deploy naar Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Eerst alles controleren (lint, typecheck, unit-tests, build en rooktest); faalt dat, dan gaat er niets live.
      - name: Playwright installeren
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Controleren (npm run check)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw
        run: npm run check
      - name: Build
        run: npm run build
      - name: Mailinstellingen voor uitnodigingen
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/mail-config.mjs
      - name: Controleer instellingen
        env:
          HOST: ${{ secrets.STRATO_SFTP_HOST }}
          DIR: ${{ secrets.STRATO_DIR }}
        run: |
          if [ -z "$HOST" ] || [ -z "$DIR" ]; then echo "::error::STRATO_SFTP_HOST en STRATO_DIR moeten als secret zijn ingesteld."; exit 1; fi
          # Veiligheid: nooit per ongeluk de hoofdmap van de webruimte overschrijven.
          # Een SFTP-gebruiker die alleen de opkomst-map ziet, gebruikt bewust `inlogmap`.
          case "${DIR%/}" in ""|"/"|".") echo "::error::STRATO_DIR mag niet de hoofdmap zijn; gebruik bijv. /opkomst, of 'inlogmap' als de SFTP-gebruiker alleen de opkomst-map ziet"; exit 1;; esac
          test -f dist/.htaccess || { echo "::error::dist/.htaccess ontbreekt"; exit 1; }
      - name: Upload naar Strato (SFTP)
        env:
          HOST: ${{ secrets.STRATO_SFTP_HOST }}
          PORT: ${{ secrets.STRATO_SFTP_PORT }}
          USER: ${{ secrets.STRATO_SFTP_USER }}
          PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
          DIR: ${{ secrets.STRATO_DIR }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          DIR="${DIR%/}"
          [ "$DIR" = "inlogmap" ] && DIR="."
          # Eerst assets/, dan index.html en de rest. Oude bestanden in assets/ blijven 7 dagen staan,
          # zodat een tabblad dat nog openstaat met de vorige versie zijn pagina's kan blijven laden.
          export DIR
          bash scripts/deploy-sftp.sh
